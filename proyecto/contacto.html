<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Personal  - Integrador-LM-2026</title> <!--Ángela Colorado Sousa 08-10-2026 -->
    <meta name="description" content="Página de contacto.">
    <meta name="keywords" content="farmacéutica, Umbrella, Corporación, contacto">
    <meta name="author" content="Angela Colorado Sousa">
</head>  

<body>
    <h1>Centro de contacto</h1>
    <!--Contenedorpara el formulario-->
    <div>
        <form action="#" method="post">
        <fieldset>
            <legend>Formulario</legend>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre"
                name="nombre" required
                maxlength="10" autofocus>
            
            <label for="correo">Correo</label>    
            <input type="email" id="correo"
                name="coreo" required>    
        </form>    
        </fieldset>
        <fieldset>
            <legend>División</legend>
            <label for="divi"></label>
            <select id="divi" name="divi">
                <option value="ubcs">U.B.C.S</option>
                <option value="white">White Umbrella</option>
                <option value="uss">U.S.S</option>
                <option value="neo">Neo-Umbrella</option>
                <option value="red">Red Umbrella</option>
                <option value="line">Umbrella Line Company</option>
                <option value="priv">Umbrella PrivSol</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Asunto</legend>
            <label for="asu"></label>
            <textarea id="asu" name="asu"
                rows="1" cols="40"
                minlength="5"></textarea>
        </fieldset>
        <fieldset>
            <legend>Mensaje</legend>
            <label for="msg"></label>
            <textarea id="msg" name="msg"
                rows="10" cols="40"
                minlength="10"></textarea>
            <input type="con" id="r1"
                name="condiciones" value="He leído y acepto las condiciones" checked>
            <label for="r1"></label>
            
    
        </fieldset>
    </div> 
</body>
